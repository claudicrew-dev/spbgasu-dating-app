services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/app.sqlite
      BACKUP_DIR: /app/data/backups
      PORT: "3000"
    volumes:
      - app_data:/app/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Укажите APP_DOMAIN в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/app.sqlite
      BACKUP_DIR: /app/data/backups
    volumes:
      - app_data:/app/data
    command: ["sh", "-c", "while true; do node server/backup.mjs; sleep 86400; done"]
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
volumes:
  app_data:
  caddy_data:
  caddy_config:
